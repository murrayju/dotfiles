if-shell "test -f ~/.tmux-airline" "source ~/.tmux-airline"
set -g mouse on
set -g set-clipboard on
# apply to any TERM: relying on a specific name (xterm-256color) silently breaks
# clipboard when TERM changes (e.g. xterm-ghostty terminfo becomes available)
set -as terminal-features ',*:clipboard:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u

# tmux-yank: copy via tmux's own OSC 52 path instead of forking xclip/pbcopy
# (xclip fails on headless remotes, and mouse copy would only set PRIMARY)
set -g @yank_selection_mouse 'clipboard'
set -g @override_copy_command 'tmux load-buffer -w -'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
